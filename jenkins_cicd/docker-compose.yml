# Jenkins LTS + доступ к Docker хоста (сборка образов Lab2 из job).
# Linux: как в методичке. Windows + Docker Desktop: при проблемах с volume для docker
# смотрите документацию Jenkins + Docker Desktop.
version: '3'

services:
  jenkins:
    image: jenkins/jenkins:lts
    privileged: true
    user: root
    ports:
      - '8080:8080'
      - '50000:50000'
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
volumes:
  jenkins_home:
