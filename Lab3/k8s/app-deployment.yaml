apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-risk-app
  namespace: cdap-lab3
spec:
  replicas: 3
  selector:
    matchLabels:
      app: credit-risk-app
  template:
    metadata:
      labels:
        app: credit-risk-app
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z credit-risk-db 5432; do echo waiting for database; sleep 2; done
      containers:
        - name: analytics-app
          image: cdap-analytics:lab3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: cdap-config
            - secretRef:
                name: cdap-secret
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cdap-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdap-secret
                  key: POSTGRES_PASSWORD
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
