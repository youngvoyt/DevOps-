apiVersion: batch/v1
kind: Job
metadata:
  name: credit-risk-loader
  namespace: cdap-lab3
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        job: credit-risk-loader
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z credit-risk-db 5432; do echo waiting for database; sleep 2; done
      containers:
        - name: loader
          image: cdap-analytics:lab3
          imagePullPolicy: IfNotPresent
          command:
            - python
            - src/etl_loader.py
          envFrom:
            - configMapRef:
                name: cdap-config
            - secretRef:
                name: cdap-secret
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cdap-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdap-secret
                  key: POSTGRES_PASSWORD
            - name: ETL_INPUT_FILE
              value: /app/data/course_project_test.csv
